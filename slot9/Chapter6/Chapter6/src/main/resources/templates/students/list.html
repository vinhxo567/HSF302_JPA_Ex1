<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h2>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Search form -->
    <form th:action="@{/students}" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc email...">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Tìm kiếm</button>
            <a th:href="@{/students}" class="btn btn-outline-danger">Xóa tìm kiếm</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${page.empty}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <table th:unless="${page.empty}" class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th><a th:href="@{/students(page=${page.number}, sort='id,' + ${reverseSortDir}, keyword=${keyword})}">ID</a></th>
                    <th><a th:href="@{/students(page=${page.number}, sort='name,' + ${reverseSortDir}, keyword=${keyword})}">Họ tên</a></th>
                    <th><a th:href="@{/students(page=${page.number}, sort='email,' + ${reverseSortDir}, keyword=${keyword})}">Email</a></th>
                    <th><a th:href="@{/students(page=${page.number}, sort='age,' + ${reverseSortDir}, keyword=${keyword})}">Tuổi</a></th>
                    <th>Chuyên ngành</th>
                    <th><a th:href="@{/students(page=${page.number}, sort='gpa,' + ${reverseSortDir}, keyword=${keyword})}">GPA</a></th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${page.content}">
                    <td th:text="${stat.count + page.number * page.size}">1</td>
                    <td th:text="${student.id}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}" th:text="${student.name}" class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td><span class="badge bg-secondary" th:text="${student.major.name}">CNTT</span></td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' : (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')" th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-outline-info me-1" title="Chi tiết"><i class="bi bi-eye"></i></a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-sm btn-outline-warning me-1" title="Sửa"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="d-inline" th:data-name="${student.name}" onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/students(page=${page.number - 1}, sort=${sortField} + ',' + ${sortDir}, keyword=${keyword})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}" th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:href="@{/students(page=${i}, sort=${sortField} + ',' + ${sortDir}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/students(page=${page.number + 1}, sort=${sortField} + ',' + ${sortDir}, keyword=${keyword})}">Sau</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
