spring.application.name=student-thymeleaf
server.port=8080

# ===== Cấu hình kết nối SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StudentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=tamtu2626
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== Cấu hình Spring Data JPA / Hibernate =====
# update: tự động tạo/cập nhật bảng 'Students' theo entity Java, giữ nguyên dữ liệu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Tắt cache Thymeleaf để khi sửa file HTML chỉ cần F5 trình duyệt, không cần restart app
spring.thymeleaf.cache=false

# Cấu hình file thông báo lỗi (messages.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
